name: ahmed_baba
description: Enterprise B2B Global Trade Infrastructure. High-fidelity Alibaba/1688 Ecosystem Clone.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  web_socket_channel: ^2.4.3
  
  # Networking & API
  dio: ^5.3.3
  grpc: ^3.2.3
  protobuf: ^3.1.0
  
  # Local Storage & Persistence
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # UI & Optimization Utilities
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_svg: ^2.0.7
  google_fonts: ^6.1.0
  
  # Geometry & Interactions
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.0.4
  url_launcher: ^6.2.4
  percent_indicator: ^4.2.3
  http: ^1.1.0

  # Push Notifications — OneSignal (Iraq compatible)
  onesignal_flutter: ^5.0.0

  # Maps — OpenStreetMap (FREE, no API key needed)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # OTP Input UI
  pin_code_fields: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/icons/
    - assets/icons/services/
    - assets/icons/stories/
    - assets/animations/
    - assets/images/
    - assets/images/china_box/
    - assets/



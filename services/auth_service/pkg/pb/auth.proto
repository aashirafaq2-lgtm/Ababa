syntax = "proto3";

package pb;

option go_package = "github.com/ahmedbaba/auth-service/pkg/pb";

service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetOrganizationMember(MemberRequest) returns (MemberResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string org_id = 3;
  string role = 4;
}

message MemberRequest {
  string user_id = 1;
  string org_id = 2;
}

message MemberResponse {
  bool is_member = 1;
  string role = 2;
}

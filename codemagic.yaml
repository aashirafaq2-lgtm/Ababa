workflows:
  ios-release:
    name: A.BABA iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Yalla Driver Key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hamakhorshed.ababa
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build Flutter IPA
        script: |
          flutter build ipa --release --build-name=1.0.0 --build-number=1
      - name: Upload to TestFlight
        script: |
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -n "$IPA_FILE" ]; then
            app-store-connect publish --path "$IPA_FILE" || true
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
